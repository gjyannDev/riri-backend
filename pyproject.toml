[project]
name = "riri-backend"
version = "0.1.0"
description = "Backend for Riri, an AI voice skills coach."
readme = "README.md"
authors = [
    { name = "gjyannDev", email = "m.ghianf@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "fastapi-problem>=0.12.1",
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langfuse>=5.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sentry-sdk[fastapi]>=2.75.0",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
